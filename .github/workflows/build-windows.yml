name: Build Windows exe

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller pytest
      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest -q tests --ignore=tests/test_online.py
      - name: Live service checks (MusicBrainz, iTunes, Deezer, Google Books, Yes24, Amazon)
        # real network requests; reported here but they do not block the exe build
        continue-on-error: true
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest -q -rs tests/test_online.py
      - name: Build exe
        run: pyinstaller --noconfirm --clean CDRipperStudio.spec
      - uses: actions/upload-artifact@v4
        with:
          name: CDRipperStudio-windows
          path: dist/CDRipperStudio.exe
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/CDRipperStudio.exe
